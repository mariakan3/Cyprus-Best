<!DOCTYPE html>
<html lang="el">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Cyprus Best - Details</title>
    <link rel="icon" type="image/png" href="logo2.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="language-bar">
        <button onclick="setLanguage('el')">🇬🇷 ΕΛ</button>
        <button onclick="setLanguage('en')">🇬🇧 EN</button>
        <button onclick="setLanguage('ru')">🇷🇺 RU</button>
        <button onclick="setLanguage('zh')">🇨🇳 CN</button>
    </div>

    <nav class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="logo1.png" alt="Cyprus Best" class="main-logo">
            </a>
        </div>

        <div class="hamburger" onclick="toggleMobileMenu()">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav-home">Home</a></li>
            <li><a href="hotels.html" data-i18n="nav-hotels">Hotels</a></li>
            <li><a href="restaurants.html" data-i18n="nav-restaurants">Restaurants</a></li>
            <li><a href="views.html" data-i18n="nav-views">Views</a></li>
            <li><a href="realestate.html" data-i18n="nav-realestate">Real Estate</a></li>
            <li><a href="thingstodo.html" data-i18n="nav-things">Things to Do</a></li>
            <li><a href="services.html" data-i18n="nav-services">Services</a></li>
        </ul>
    </nav>

    <div class="details-container">
        <div class="details-header-wrap">
            <header id="details-header" class="details-header"></header>
            <div id="details-fav-slot" class="details-fav-slot"></div>
        </div>

        <section class="details-content">
            <div class="details-title-row">
                <h1 id="place-title"></h1>
            </div>

            <div class="details-quick-actions">
                <a id="map-link" href="#" target="_blank" class="filter-btn details-map-cta" style="display:none;" data-i18n="lbl-map">📍 Open Map</a>
                <a id="web-link" href="#" target="_blank" class="filter-btn" style="display:none;" data-i18n="lbl-website">🌍 Website</a>
            </div>

            <div id="details-map-wrap" class="details-map-wrap" style="display:none;">
                <h3 data-i18n="map-title">Map</h3>
                <div id="details-map" class="places-map details-map"></div>
            </div>

            <hr class="details-divider">

            <div id="place-description" class="long-text"></div>

            <div id="phone-wrapper" class="contact-box" style="display:none;">
                <strong data-i18n="lbl-phone">📞 Phone:</strong> <span id="place-phone"></span>
            </div>
        </section>
    </div>

    <footer class="main-footer">
        <div class="footer-content">
            <h3>Cyprus Best</h3>
            <p data-i18n="footer-tagline">The best of the island, recommended by locals.</p>

            <div class="social-icons">
                <a href="https://www.instagram.com/cyprusbest.official" target="_blank" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.tiktok.com/@cyprusbest.official" target="_blank" title="TikTok">
                    <i class="fab fa-tiktok"></i>
                </a>
                <a href="https://www.facebook.com/people/Cyprus-Best/61587298716101/" target="_blank" title="Facebook">
                    <i class="fab fa-facebook"></i>
                </a>
                <a href="https://www.linkedin.com/company/cyprus-best/" target="_blank" title="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
            </div>

            <p class="copyright" data-i18n="footer-copyright">&copy; 2026 Cyprus Best. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
