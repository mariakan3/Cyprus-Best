<head>

    <title>Cyprus Best - Favorites</title>
    <link rel="icon" type="image/png" href="logo2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://qahpepjvksxrhugmxpgg.supabase.co">
    <link rel="preload" as="image" href="images/opt/hero/cyprus-holidays.jpg.webp" fetchpriority="high">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"></noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="stylesheet" href="style.css?v=20261013">
</head>
<body>

    <div class="language-bar">
        <button onclick="setLanguage('el')" class="lang-el">ΕΛ</button>
        <button onclick="setLanguage('en')" class="lang-en">EN</button>
        <button onclick="setLanguage('ru')" class="lang-ru">RU</button>
        <button onclick="setLanguage('zh')" class="lang-zh">CN</button>
    </div>

    <nav class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="images/opt/ui/logo1.webp" decoding="async" data-fallback="logo1.png" onerror="if(this.dataset.fallback){this.onerror=null;this.src=this.dataset.fallback}" alt="Cyprus Best" class="main-logo">
            </a>
        </div>

        <div class="hamburger" onclick="toggleMobileMenu()">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav-home">Home</a></li>
            <li><a href="hotels.html" data-i18n="nav-hotels">Hotels</a></li>
            <li><a href="restaurants.html" data-i18n="nav-restaurants">Restaurants</a></li>
            <li><a href="views.html" data-i18n="nav-views">Views</a></li>
            <li><a href="beaches.html" data-i18n="nav-beaches">Beaches</a></li>
            <li><a href="realestate.html" data-i18n="nav-realestate">Real Estate</a></li>
            <li><a href="thingstodo.html" data-i18n="nav-things">Things to Do</a></li>
            <li><a href="services.html" data-i18n="nav-services">Services</a></li>
        </ul>
    </nav>

    <header class="page-header" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('images/opt/hero/cyprus-holidays.jpg.webp');">
        <h1 data-i18n="fav-title">My Favorites</h1>
    </header>

    <div class="filter-block">
        <p class="filter-label" data-i18n="slider-label">Categories</p>
        <div id="favCategoryContainer" class="filter-row">
            <button class="filter-btn active" onclick="setCategoryFilter('all')" data-i18n="filter-all">All</button>
            <button class="filter-btn" onclick="setCategoryFilter('hotels')" data-i18n="nav-hotels">Hotels</button>
            <button class="filter-btn" onclick="setCategoryFilter('restaurants')" data-i18n="nav-restaurants">Restaurants</button>
            <button class="filter-btn" onclick="setCategoryFilter('views')" data-i18n="nav-views">Views</button>
            <button class="filter-btn" onclick="setCategoryFilter('beaches')" data-i18n="nav-beaches">Beaches</button>
            <button class="filter-btn" onclick="setCategoryFilter('realestate')" data-i18n="nav-realestate">Real Estate</button>
            <button class="filter-btn" onclick="setCategoryFilter('things')" data-i18n="nav-things">Things to Do</button>
            <button class="filter-btn" onclick="setCategoryFilter('services')" data-i18n="nav-services">Services</button>
        </div>
    </div>

    <div class="filter-block" id="favTypeFilterBlock" hidden>
        <div id="myBtnContainer"></div>
    </div>

    <div class="filter-block">
        <p class="filter-label" data-i18n="filter-towns">Town</p>
        <div id="townFilterContainer" class="filter-row">
            <button class="filter-btn active" onclick="setTownFilter('all')" data-i18n="filter-all">All</button>
            <button class="filter-btn" onclick="setTownFilter('paphos')" data-i18n="town-paphos">Paphos</button>
            <button class="filter-btn" onclick="setTownFilter('limassol')" data-i18n="town-limassol">Limassol</button>
            <button class="filter-btn" onclick="setTownFilter('larnaca')" data-i18n="town-larnaca">Larnaca</button>
            <button class="filter-btn" onclick="setTownFilter('nicosia')" data-i18n="town-nicosia">Nicosia</button>
            <button class="filter-btn" onclick="setTownFilter('famagusta')" data-i18n="town-famagusta">Famagusta</button>
        </div>
    </div>

    <p id="fav-filter-empty" class="favorites-empty" hidden data-i18n="fav-filter-empty">No favorites match this filter.</p>

    <section class="items-list" id="favorites-container">
        <p style="text-align:center; width:100%;" data-i18n="loading">Loading...</p>
    </section>

    <footer class="main-footer">
        <div class="footer-content">
            <h3>Cyprus Best</h3>
            <p data-i18n="footer-tagline">The best of the island, recommended by locals.</p>

            <div class="social-icons">
                <a href="https://www.instagram.com/cyprusbest.official" target="_blank" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.tiktok.com/@cyprusbest.official" target="_blank" title="TikTok">
                    <i class="fab fa-tiktok"></i>
                </a>
                <a href="https://www.facebook.com/people/Cyprus-Best/61587298716101/" target="_blank" title="Facebook">
                    <i class="fab fa-facebook"></i>
                </a>
                <a href="https://www.linkedin.com/company/cyprus-best/" target="_blank" title="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
            </div>

            <p class="copyright" data-i18n="footer-copyright">&copy; 2026 Cyprus Best. All rights reserved.</p>
        </div>
    </footer>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="script.js?v=20261013b"></script>
</body>
</html>
